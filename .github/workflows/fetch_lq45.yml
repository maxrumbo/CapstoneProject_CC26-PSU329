name: Fetch LQ45 Daily

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: data-scientist/saham
        run: pip install -r requirements.txt

      - name: Run fetcher
        working-directory: data-scientist/saham
        run: |
          python src/fetch_lq45.py
          echo "--- Cek file CSV ---"
          ls -la data/
          tail -2 data/lq45_historical.csv

      - name: Commit & push CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-scientist/saham/data/lq45_historical.csv
          git diff --cached --quiet || git commit -m "data: update LQ45 $(date +'%Y-%m-%d')"
          git push
